; calib_capture 采集配置；只有显式 --config 才读取本文件。
; 值不加引号；注释单独起一行，以 ; 或 # 开头。
;
; 接线清单（仅供参考，不用于切换上游流水线）：
; cali VIN：左 pipe 2/chn 0，右 pipe 0/chn 0；AX_VIN_GetYuvFrame；NV12。
; vis VIN：左 pipe 2/chn 0，右 pipe 0/chn 0；NV12 3840x2160。
; vis IVPS：左 grp 7/chn 0，右 grp 8/chn 0；AX_IVPS_GetChnFrame；YUV400 640x384。
; 正式标定只读取 cali VIN，不读取 vis IVPS。

[capture]
; 运行库与 SDK；SDK 路径留空表示自动查找。
ax_lib_dir = /soc/lib
sdk_include_dir =

; 双目映射；分辨率只校验上游输出，不切换配置或缩放。
left_pipe = 2
left_chn = 0
right_pipe = 0
right_chn = 0
resolution = 3840x2160
expected_source_rate_hz = 50

; 双目默认 5 Hz（约 200 ms 一对），IMU 不受此参数影响。
save_rate_hz = 5
; 0 使用上面的 Hz；若改为正数分频，需删除或注释 save_rate_hz。
; 源周期 20 ms 时，frame_divisor = 3 约为 60 ms 一对。
frame_divisor = 0
duration_s = 60
poses = 20

; 双目同步、取帧与写盘队列。
sync_tolerance_us = 2000
max_sync_retries = 10
capture_timeout_ms = 200
writer_queue_pairs = 2
startup_timeout_s = 15

; IMU 收到的消息全部保存；100 Hz 仅用于质量检查，不限频。
imu_topic = /imu/data
imu_expected_rate_hz = 100
imu_qos_depth = 2000
clock_domain_max_offset_s = 5

; 输出话题与坐标系名称。
left_topic = /stereo/left/image_raw
right_topic = /stereo/right/image_raw
left_frame_id = cam0
right_frame_id = cam1
imu_frame_id = imu0
