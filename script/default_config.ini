; 使用 --config script/default_config.ini 加载；未列出的参数沿用内置默认值。

[capture]
; 当前配置版本；旧配置不再自动兼容。
schema_version = 1.0.0
; 数据集前缀；留空按模式选择（含 stereo、stereo_base_link、stereo_imu、usb、usb_base_link、imu）。
dataset_name =
; VIN 为 3840x2160 或 1920x1080；USB 固定 1280x960、源帧率 30 Hz。
resolution = 3840x2160
; 左右原始 PTS 最大差，单位 µs；等于阈值允许，超限重同步。
sync_tolerance_us = 200
; 采集固定使用无损 BMP，不依赖 OpenCV。
; USB 未显式配置时默认 rgb BMP；命令行 --pixel-format mono8 可改为灰度。
image_format = bmp
; 图像线程数 1–8。
image_workers = 2

; 连续采集：双目保存频率与时长（秒）；IMU 不限频。
save_rate_hz = 5
; 连续图像或独立 imu-continuous 的时长（秒）。
; 连续相机模式省略 duration_s 时持续采集，按 Ctrl+C 正常结束。
; 仅 stereo-triggered 使用：按 Enter 保存的姿态数。
poses = 20

; stereo-imu / probe --with-imu 使用，收到的消息全部保存。
imu_topic = /imu/data
; 仅 imu-continuous：温度按最新收到的值填入同一 CSV。
imu_temperature_topic = /imu/temperature
use_temperature = true
; 仅 stereo-imu：图像窗口前后 IMU 覆盖秒数；0 关闭，不计入 duration_s。
imu_preroll_s = 1
imu_postroll_s = 1
