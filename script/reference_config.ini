; 全部可加载的采集参数；日常使用 default_config.ini 即可。
; python3 script/calibration_data.py --config script/reference_config.ini stereo-imu
; 优先级：CLI > 本文件 > 内置默认值。值不加引号，注释单独起行。
; 只允许 [capture]；以下默认值与程序一致。

[capture]
; Experimental stereo-raw-triggered uses only SDK, pipe, resolution, poses,
; sync/timeout and naming options; node IFE and exposure L are fixed.
; No RAW channel, image encoder, rate limit or IMU settings are applied.
; 当前配置版本；必须为 1.0.0。
schema_version = 1.0.0
; 前缀允许 1–64 个 ASCII 字母、数字、下划线或连字符，首字符为字母或数字。
; 留空按模式使用 stereo、stereo_base_link、stereo_imu、usb、usb_base_link 或 imu。
dataset_name =
; AX 运行库目录；仍需在启动 Python 前设置 BSP_MSP_DIR 和 LD_LIBRARY_PATH。
ax_lib_dir = /soc/lib
; SDK include 目录；空值自动查找，找到后检查头文件契约。
sdk_include_dir =

; cali VIN / AX_VIN_GetYuvFrame / NV12；不启动或重配相机管线。
left_pipe = 2
left_chn = 0
right_pipe = 0
right_chn = 0
; VIN 为 3840x2160 或 1920x1080；USB 命令忽略此项并固定校验 1280x960。
resolution = 3840x2160
; 源帧率预期值：用于质量检查及分频目标估计，不设置相机帧率。
expected_source_rate_hz = 50

; 采集固定使用无损 BMP，不依赖 OpenCV。
image_format = bmp
; 落盘像素：VIN 只能 mono8；USB 未配置此键时内置默认 rgb，也可设 mono8。
; 完整参考配置使用 mono8，便于同一文件安全用于 VIN；USB RGB 请改为 rgb。
pixel_format = mono8
; 复用图像线程数 1–8。
image_workers = 2
; 等待队列容量（双目对），正整数；满时整对丢弃，不无限缓存。
writer_queue_pairs = 2

; 连续双目 / stereo-imu / usb-continuous 的目标保存频率（Hz），不限制 IMU。
save_rate_hz = 5
; 源序号分频：0 关闭。USB 命令始终忽略分频并使用 save_rate_hz。
; 源周期 20 ms 时，5 约为 100 ms 一对；与按 Hz 限频二选一。
frame_divisor = 0
; 图像采集窗口（秒），正数；不含 IMU 前后滚、写盘排空与校验。
; imu-continuous 也使用此时长，从首条消息后计时；示例 3600 为一小时。
; 连续相机模式省略此项时持续采集，按 Ctrl+C 正常结束；填写正数则定时结束。
duration_s = 60
; 仅 stereo-triggered 使用：目标姿态数，正整数。
poses = 20

; 左右原始 PTS 最大差（µs）：<= 200 接受，> 200 重取较早侧。
sync_tolerance_us = 200
; 同步重取上限，正整数；耗尽后失败并保留现场数据。
max_sync_retries = 10
; 单次 VIN 取帧超时（毫秒），正整数。
capture_timeout_ms = 200
; 启动等待 IMU 的超时（秒），正数。
startup_timeout_s = 15

; stereo-imu / probe --with-imu 订阅话题；收到的消息全部保存。
; stereo-imu / imu-continuous：全部保存，不随图像限频。
imu_topic = /imu/data
; 仅 imu-continuous，sensor_msgs/msg/Temperature，单位摄氏度。
; 等待首条温度后保存 IMU；温度未更新时沿用上一值，不插值。
imu_temperature_topic = /imu/temperature
; false 时不订阅温度，独立 IMU CSV 只写七列六轴数据。
use_temperature = true
; IMU 预期频率（Hz），仅用于质量检查，不限频。
imu_expected_rate_hz = 100
; KEEP_LAST 队列深度，正整数；可靠性 BEST_EFFORT，持久性 VOLATILE。
imu_qos_depth = 2000
; 仅 stereo-imu：图像前/后至少保存的 IMU 时长，有限非负秒数；0 关闭。
; 按原始时间戳判断；各阶段最多等待 配置时长 + startup_timeout_s。
imu_preroll_s = 1
imu_postroll_s = 1
; 前滚前同时取得的相机与 IMU 参照允许的时间域差（秒），非双目同步阈值。
clock_domain_max_offset_s = 5

; 图像输出话题名称，用于数据集及 PC 离线 bag，不从这些话题取图。
left_topic = /stereo/left/image_raw
right_topic = /stereo/right/image_raw
; 图像 Header frame_id。
left_frame_id = cam0
right_frame_id = cam1
; IMU 原消息 frame_id 为空时的回退名称，不覆盖非空原值。
imu_frame_id = imu0

; 以下是 CLI 专用选项，不是合法 INI 键，不要取消这些注释：
; USB 固定 AX_IVPS_GetChnFrame grp 3/chn 0、1280x960、源帧率 30 Hz，不可通过 INI 覆盖。
; usb-continuous 的 --rate-hz 是 --save-rate-hz 的等价别名。
; --output ./data：采集输出根目录，自动创建 YYYY-MM-DD_HH-MM-SS 子目录。
; probe --samples 50 --with-imu：诊断样本对数、是否同时探测 IMU。
; validate DATASET：离线校验，使用数据集自身的会话配置。
; allan DATASET：PC 离线六轴 Allan 分析，不读取采集 INI。
; 默认输出：项目根目录 data/allan_variance/allantools_output/<输入目录名>/。
; allan --output PATH --rate-hz HZ --taus decade|octave --allow-irregular。
; allan --start-s 3600 --end-s 86400：相对第一条 IMU 的秒数，[start,end)。
; 指定时间默认目录追加 _1h-24h；非整数小时一位小数；--output 指定完整路径。
; allan --kalibr-noise --kalibr-imu-topic /imu/data：拟合完整时导出候选 kalibr_imu.yaml。
; export-ros1 DATASET BAG：仅 PC 使用；--compression none|lz4|bz2。
; export-ros1 --left-topic /cam0/image_raw --right-topic /cam1/image_raw --imu-topic /imu0。
; export-ros1 --force-dataset：仅诊断损坏数据，不用于正式交付。
; self-test --sdk-include-dir PATH：无硬件自检及可选 SDK 头文件检查。
; --config PATH、--version、--help：主命令选项；--help 也可跟在子命令后。
